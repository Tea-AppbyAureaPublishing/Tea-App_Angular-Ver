<div class="login-container">

  <div class="welcome-header">
    <h1>Bienvenido a Tea-App</h1>
    <div class="logo-container">
      <!-- Ajusta la ruta a la de tu logo -->
      <img class="logo-img" src="/favicon.svg" alt="Tea-App">
    </div>
  </div>

  <div class="login-card">
    <h2>Crear Cuenta</h2>

    <form class="form-container" [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input id="name" type="text" formControlName="name" placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input id="username" type="text" formControlName="username" placeholder="Tu usuario">
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Repetir contraseña</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="••••••••">
      </div>

      <p class="error-text" *ngIf="registerForm.errors?.['mismatch'] && registerForm.get('confirmPassword')?.touched">
        Las contraseñas no coinciden.
      </p>

      <button type="submit" [disabled]="registerForm.invalid" class="btn-amarillo">
        Crear cuenta
      </button>
    </form>

    <a routerLink="/login" class="register-link">¿Ya tienes cuenta? Inicia sesión</a>
  </div>

</div>
