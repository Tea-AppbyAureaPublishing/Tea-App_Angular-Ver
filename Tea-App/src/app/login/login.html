<!-- src/app/login/login.html -->
<div class="login-container">
  
  <div class="welcome-header">
    <h1>Bienvenido a Tea-App</h1>
    <div class="logo-container">
      <img src="/favicon.svg" alt="Logo Tea-App" class="logo-img">
    </div>
  </div>

  <div class="login-card">
    
    <!-- VISTA 1: ACCESO -->
    @if (currentView === 'login') {
      <h2>Iniciar Sesión</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="form-container">
        <div class="form-group">
          <label>Usuario o Correo electrónico</label>
          <input type="text" formControlName="identifier" placeholder="Ej: usuario o correo@ejemplo.com">
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" formControlName="password" placeholder="••••••••">
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 5px;">
          <button type="submit" [disabled]="loginForm.invalid" class="btn-amarillo">
            Entrar
          </button>
        </div>
      </form>

      <a (click)="setView('forgot')" class="forgot-link">¿Has olvidado la contraseña?</a>
      <div class="divider"></div>
      <a routerLink="/registro" class="register-link">Crear cuenta</a>
    }

    <!-- VISTA 2: RECUPERACIÓN -->
    @if (currentView === 'forgot') {
      <h2>Restablecer Contraseña</h2>
      <p class="info-text">Introduce tu correo electrónico y te enviaremos un enlace de recuperación.</p>
      
      <form [formGroup]="forgotForm" (ngSubmit)="onResetPassword()" class="form-container">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" formControlName="resetEmail" placeholder="ejemplo@correo.com">
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 5px;">
          <button type="submit" [disabled]="forgotForm.invalid" class="btn-amarillo">
            Enviar enlace
          </button>
        </div>
      </form>

      <a (click)="setView('login')" class="forgot-link" style="margin-top: 10px; display: block;">
        Volver al inicio de sesión
      </a>
    }

  </div>
</div>
